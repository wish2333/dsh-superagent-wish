# Inserts the preset-manager entry for the Partner mode.
# The manager registers the "Partner" preset into the selector;
# the instructions entry is only loaded when that preset is active.
- insert:
    - id: superagent-wish-manager
      name: "@wish2333/dsh-superagent-wish"
      config:
        role: manager
        # How many implementers run at once; a discoverer never takes a slot and
        # a wish follow-up never waits for one. Default 2, range 1–16.
        implementerSlots: 2
