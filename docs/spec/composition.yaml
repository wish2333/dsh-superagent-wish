# ./composition.yaml
# 组合层：两类 Worker 的 preset 与工具边界
# 规格说明见 composition-spec.md，技术方案见 ../impl/superagent-impl.md
# Worker 是独立 DSH 会话，不用子代理（R28）

version: "2.0"

workers:
  discoverer:
    label: 启发者
    preset_id: superagent-wish-discoverer
    purpose: 探索性任务，产出写成文件，不改仓库
    input: exploratory_prompt
    output: ideas_and_options
    tools:
      - read
      - glob
      - grep
      - web_search
      - web_fetch
      - write
      - edit
      - todo_write
      - partner_report

  implementer:
    label: 执行者
    preset_id: superagent-wish-implementer
    purpose: 按 task spec 产出交付物
    input: task_spec
    output: artifact
    tools:
      - read
      - glob
      - grep
      - web_search
      - web_fetch
      - write
      - edit
      - bash
      - todo_write
      - partner_report

runtime_binding:
  dsh:
    preset_registration: "@deepseek-ai/dsh-agent-preset"
    session_creation: ctx.sessionController.create
    workspace: ctx.workspaceRegistry.create
    permission: ctx.permissionPresets.set
    dispatch: partner_dispatch
    delivery: agent.followup
    report_relay: agent.steer
    permission_mode: danger-full-access
    model: default
    followup: partner_followup
    stop: partner_stop
